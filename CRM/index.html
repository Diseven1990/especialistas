<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Especialistas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:transparent;
font-family:'Inter',sans-serif;
overflow-x:hidden;
overflow-y:auto;
color:white;
}

.specialists-section{
width:100%;
padding:24px 10px;
overflow:visible;
}

.section-header{
width:100%;
display:flex;
justify-content:flex-end;
margin-bottom:20px;
}

.controls{
display:flex;
gap:10px;
}

.control-btn{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:#111;
color:white;
cursor:pointer;
font-size:18px;
transition:0.2s ease;
}

.control-btn:hover{
background:#ff7a00;
}

.specialists-slider{
display:flex;
gap:12px;
overflow-x:auto;
padding:0 6px;
scroll-behavior:smooth;
scrollbar-width:none;
-webkit-overflow-scrolling:touch;
}

.specialists-slider::-webkit-scrollbar{
display:none;
}

.specialist-card{
position:relative;
min-width:260px;
width:260px;
height:430px;
border-radius:28px;
overflow:hidden;
flex-shrink:0;
background:#111;
}

.specialist-card img{
width:100%;
height:100%;
object-fit:cover;
display:block;
filter:grayscale(100%) contrast(1.05);
}

.overlay{
position:absolute;
inset:0;

background:linear-gradient(
to top,
rgba(0,0,0,0.95) 8%,
rgba(0,0,0,0.55) 45%,
rgba(0,0,0,0.08) 75%
);

padding:18px;

display:flex;
flex-direction:column;
justify-content:flex-end;
}

.specialist-name{
font-size:28px;
line-height:0.95;
font-weight:900;
text-transform:uppercase;
margin-bottom:10px;
}

.specialist-role{
font-size:13px;
font-weight:400;
line-height:1.4;
opacity:0.96;
margin-bottom:16px;
}

.linkedin-button{
height:42px;
border-radius:14px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.08);

display:flex;
align-items:center;
justify-content:center;
gap:10px;

text-decoration:none;

color:white;

font-size:14px;
font-weight:700;

transition:0.2s ease;
}

.linkedin-button:hover{
background:#0A66C2;
border-color:#0A66C2;
}

.linkedin-button svg{
width:18px;
height:18px;
flex-shrink:0;
}

/* MOBILE */

@media(max-width:768px){

.section-header{
display:none;
}

.specialists-slider{
display:flex;
flex-direction:column;
overflow:visible;
height:auto;
gap:16px;
padding:0;
}

.specialist-card{
width:100%;
min-width:100%;
height:430px;
border-radius:24px;
}

.specialist-name{
font-size:24px;
}

.specialist-role{
font-size:12px;
}

}

</style>
</head>

<body>

<section class="specialists-section">

<div class="section-header">

<div class="controls">
<button class="control-btn" id="prevBtn">‹</button>
<button class="control-btn" id="nextBtn">›</button>
</div>

</div>

<div class="specialists-slider" id="slider">

</div>

</section>

<script>

const data = [

["naiara-back.jpg","NAIARA<br>BACK","Web Copywriter e Especialista em IA.","https://www.linkedin.com/in/naiaraback/"],

["joseanne-araujo.jpg","JOSEANNE<br>ARAÚJO","Social Media Manager e Consultora de Branding.","https://www.linkedin.com/in/joseannezaraujo/"],

0 7.225 0 7.225h2.4z"/>

</svg>

LinkedIn

</a>

</div>

</div>

`;

});

document.getElementById('nextBtn').addEventListener('click', () => {

slider.scrollBy({
left:280,
behavior:'smooth'
});

});

document.getElementById('prevBtn').addEventListener('click', () => {

slider.scrollBy({
left:-280,
behavior:'smooth'
});

});

</script>

</body>
</html>
